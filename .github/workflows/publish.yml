name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag matches package.json version
        run: |
          version="v$(jq -r .version package.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Verify tagged commit is on dev
        run: |
          if ! git merge-base --is-ancestor HEAD origin/dev; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on dev" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm ci
      # build runs via the prepublishOnly hook
      - run: pnpm publish --provenance --access public --no-git-checks
